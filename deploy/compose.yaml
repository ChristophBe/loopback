name: loopback

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: dev
    environment:
      API_ADDR: ":8080"
      GAMIFICATION_FILE: /src/api/gamification.yaml
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # Development default; set a random value of at least 32 bytes elsewhere.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-prod}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
    ports: ["8080:8080"]
    volumes:
      - ../backend:/src/backend
      - ../api:/src/api:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 3s
      retries: 30

  import:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: build
    command: ["/out/import"]
    profiles: ["tools"]
    environment:
      CONTENT_DIR: /content
      # The container has no git; `make import` passes the SHA of the checkout.
      CONTENT_SHA: ${CONTENT_SHA:-}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ../content:/content:ro
    depends_on:
      db: {condition: service_healthy}

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: dev
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ../web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api: {condition: service_healthy}

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

volumes:
  db-data:
  web-node-modules:
