name: loopback

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: dev
    environment:
      API_ADDR: ":8080"
      GAMIFICATION_FILE: /src/api/gamification.yaml
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # At least 32 bytes; `make` copies a development value from deploy/.env.example.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (see deploy/.env.example)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      # Local stack only: enables POST /auth/dev-login. Never set it in production.
      AUTH_DEV_LOGIN: "true"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-loopback@localhost}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      MAGIC_LINK_TTL: ${MAGIC_LINK_TTL:-15m}
      # OAuth sign-in; a provider without client id and secret answers 404.
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-http://localhost:8080/api/v1}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
    ports: ["8080:8080"]
    volumes:
      - ../backend:/src/backend
      - ../api:/src/api:ro
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      import: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: arigaio/atlas:1.2.0-alpine
    command: ["migrate", "apply", "--dir", "file://migrations", "--url", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"]
    volumes:
      - ../backend/migrations:/migrations:ro
    depends_on:
      db: {condition: service_healthy}

  import:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: build
    command: ["/out/import"]
    environment:
      CONTENT_DIR: /content
      # The container has no git; `make import` passes the SHA of the checkout.
      CONTENT_SHA: ${CONTENT_SHA:-}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ../content:/content:ro
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: dev
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ../web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api: {condition: service_healthy}

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

volumes:
  db-data:
  web-node-modules:
