name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make check-gen

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loopback
          POSTGRES_PASSWORD: loopback
          POSTGRES_DB: loopback
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loopback"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://loopback:loopback@localhost:5432/loopback?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          args: --config ../.golangci.yml
      - run: make test-go

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make lint-web test-web
      - run: cd web && pnpm exec vite build

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: cd plugin && ./gradlew ktlintCheck detekt test buildPlugin verifyPlugin

  specs-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tools/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools/pnpm-lock.yaml
      - run: make lint-specs lint-content lint-docs
      - run: pipx install yamllint
      - run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github deploy api

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/api/v1/healthz
      - run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:5173/
      - if: failure()
        run: docker compose -f deploy/compose.yaml --env-file .env logs
      - if: always()
        run: make down
