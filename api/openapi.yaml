openapi: 3.0.3
info:
  title: loopback API
  version: 0.1.0
  description: REST API shared by the loopback web app and the JetBrains plugin.
  contact:
    name: loopback
    url: https://github.com/ChristophBe/loopback
tags:
  - name: ops
    description: Operational endpoints.
  - name: gamification
    description: XP, levels, streaks and the daily goal.
  - name: content
    description: Courses, lessons and exercises imported from the content repository.
  - name: progress
    description: Lesson completions, exercise attempts and the progress of the learner.
  - name: auth
    description: Sign-in with magic link, OAuth and the device-code flow, and token refresh.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report whether the API is up.
      description: Returns status ok when the API can serve requests.
      tags: [ops]
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /config:
    get:
      operationId: getConfig
      summary: Return the gamification rules and the API version.
      description: Clients read the XP, level and daily goal rules here and keep no copy.
      tags: [gamification]
      security: []
      responses:
        "200":
          description: The current configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
  /courses:
    get:
      operationId: listCourses
      summary: List the courses.
      description: Returns every course, ordered by language and project.
      tags: [content]
      responses:
        "200":
          description: The courses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Error"
  /courses/{id}/lessons:
    get:
      operationId: listCourseLessons
      summary: List the lessons of a course.
      description: Returns the lessons of the course in path order, with starter files, tests, hints and owned files.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The lessons of the course.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /lessons/{id}:
    get:
      operationId: getLesson
      summary: Return one lesson.
      description: Returns the lesson with starter files, tests, hints and owned files.
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The lesson.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /exercises:
    get:
      operationId: listExercises
      summary: List the exercises.
      description: Returns quizzes, flashcard decks and reviews, optionally filtered by course or type.
      tags: [content]
      parameters:
        - name: courseId
          in: query
          required: false
          description: Only exercises of this course.
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          required: false
          description: Only exercises of this type.
          schema:
            $ref: "#/components/schemas/ExerciseType"
      responses:
        "200":
          description: The exercises.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercise"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /lessons/{id}/completions:
    post:
      operationId: completeLesson
      summary: Report the check result of a lesson.
      description: >-
        The plugin reports the result of the check run. The server records the completion when
        the check passed. The Idempotency-Key header makes a retry safe: a replay with the same
        key and body returns 200 with the stored completion. The same key with a different body
        or for another lesson yields 409.
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckResult"
      responses:
        "200":
          description: A replay of an earlier request with the same Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Completion"
        "201":
          description: The completion is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Completion"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /exercises/{id}/attempts:
    post:
      operationId: createExerciseAttempt
      summary: Report an attempt at a quiz, flashcard deck or review.
      description: The web app reports the learner's answers to one exercise.
      tags: [progress]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptRequest"
      responses:
        "201":
          description: The attempt is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attempt"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: Return the signed-in learner.
      description: Returns the profile of the learner that owns the access token.
      tags: [progress]
      responses:
        "200":
          description: The learner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /me/progress:
    get:
      operationId: getMyProgress
      summary: Return the progress of the signed-in learner.
      description: Returns the position per course and the finished lessons.
      tags: [progress]
      responses:
        "200":
          description: The progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "401":
          $ref: "#/components/responses/Error"
  /auth/magic-link:
    post:
      operationId: requestMagicLink
      summary: Email a sign-in link.
      description: Sends a single-use sign-in link to the address. The response is the same whether or not an account exists.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequest"
      responses:
        "202":
          description: The link is on its way.
        "400":
          $ref: "#/components/responses/Error"
  /auth/magic-link/verify:
    post:
      operationId: verifyMagicLink
      summary: Sign in with the token of an emailed link.
      description: >-
        The link in the email opens the web app with the token. The app sends it here.
        The token works once and expires; a used, expired or invalid token yields 401 invalid_grant.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkVerifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/oauth/{provider}:
    get:
      operationId: startOAuth
      summary: Start the OAuth sign-in with a provider.
      description: >-
        Redirects the browser to the provider's authorization page and sets the short-lived
        oauth_state cookie that the callback checks against the state parameter.
        An unknown or unconfigured provider yields 404.
      tags: [auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The OAuth provider.
          schema:
            $ref: "#/components/schemas/OAuthProvider"
      responses:
        "302":
          description: Redirect to the provider's authorization page.
          headers:
            Location:
              description: The authorization URL of the provider.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: The oauth_state cookie (HttpOnly, SameSite=Lax) that binds the flow to this browser.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
  /auth/oauth/{provider}/callback:
    get:
      operationId: finishOAuth
      summary: Finish the OAuth sign-in with a provider.
      description: >-
        The provider redirects the browser here. The state parameter must match the signed
        state of the flow and the oauth_state cookie. The response creates or links the Identity
        and returns a new token pair. A provider account is linked to the user with the same
        verified email, or a new user is created.
      tags: [auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The OAuth provider.
          schema:
            $ref: "#/components/schemas/OAuthProvider"
        - name: code
          in: query
          required: true
          description: The authorization code from the provider.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The state from the authorization redirect.
          schema:
            type: string
        - name: oauth_state
          in: cookie
          required: false
          description: The cookie that GET /auth/oauth/{provider} set.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/device:
    post:
      operationId: startDeviceAuthorization
      summary: Start the device-code sign-in.
      description: The plugin shows the user code and the verification URI, then polls POST /auth/token with the device code.
      tags: [auth]
      security: []
      responses:
        "200":
          description: The device authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
  /auth/device/approve:
    post:
      operationId: approveDeviceCode
      summary: Approve a device code as the signed-in user.
      description: >-
        The web app calls this after the learner enters the user code. The next poll of
        POST /auth/token returns tokens for the learner.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveDeviceRequest"
      responses:
        "204":
          description: The code is approved.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /auth/token:
    post:
      operationId: exchangeDeviceCode
      summary: Exchange a device code for tokens.
      description: >-
        Poll at the interval from POST /auth/device. While the user has not approved the code,
        the response is 400 with error authorization_pending.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Exchange a refresh token for new tokens.
      description: The refresh token is single-use. The response carries a new pair.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/token or POST /auth/refresh.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Numeric id.
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (a UUID) that makes a retry of the request safe.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Tokens:
      description: A new access and refresh token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponse"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable code.
          enum:
            - invalid_request
            - invalid_grant
            - authorization_pending
            - slow_down
            - expired_token
            - access_denied
            - unauthorized
            - not_found
        errorDescription:
          type: string
          description: Human-readable detail.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    MagicLinkVerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the emailed link.
    OAuthProvider:
      type: string
      enum: [github, google]
    DeviceAuthorization:
      type: object
      required: [deviceCode, userCode, verificationUri, interval, expiresIn]
      properties:
        deviceCode:
          type: string
          description: Secret the plugin sends to POST /auth/token.
        userCode:
          type: string
          description: Short code the user enters at the verification URI.
        verificationUri:
          type: string
          format: uri
        interval:
          type: integer
          minimum: 1
          description: Minimum seconds between polls.
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the device code expires.
    ApproveDeviceRequest:
      type: object
      required: [userCode]
      properties:
        userCode:
          type: string
          description: The code shown by the plugin. Case and dashes are ignored.
    TokenRequest:
      type: object
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the access token expires.
    Language:
      type: string
      enum: [go, rust]
    Course:
      type: object
      required: [id, language, project, title]
      properties:
        id:
          type: integer
        language:
          $ref: "#/components/schemas/Language"
        project:
          type: string
        title:
          type: string
    Lesson:
      type: object
      required: [id, courseId, slug, order, title, minutes, xp, body, ownedFiles, starterFiles, testFiles, hints, failureExplanations]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        slug:
          type: string
        order:
          type: integer
          minimum: 1
        title:
          type: string
        minutes:
          type: integer
          minimum: 1
        xp:
          type: integer
          minimum: 1
        body:
          type: string
          description: Markdown body of the lesson.
        ownedFiles:
          type: array
          items:
            type: string
        starterFiles:
          type: object
          description: Maps a path relative to the learner's project to the file content.
          additionalProperties:
            type: string
        testFiles:
          type: object
          description: Maps a path relative to the learner's project to the file content.
          additionalProperties:
            type: string
        hints:
          type: array
          items:
            type: string
        failureExplanations:
          type: object
          description: Maps a test name to the explanation shown when it fails.
          additionalProperties:
            type: string
    ExerciseType:
      type: string
      enum: [quiz, flashcard, review]
    Exercise:
      type: object
      required: [id, courseId, slug, type, title, payload]
      properties:
        id:
          type: integer
        courseId:
          type: integer
        slug:
          type: string
        type:
          $ref: "#/components/schemas/ExerciseType"
        title:
          type: string
        payload:
          type: object
          description: Type-specific content (questions, cards or findings), as in api/schemas.
          additionalProperties: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Config:
      type: object
      required: [version, gamification]
      properties:
        version:
          type: string
        gamification:
          $ref: "#/components/schemas/GamificationRules"
    GamificationRules:
      type: object
      required: [xpPerLesson, xpPerLevel, dailyGoalLessons]
      properties:
        xpPerLesson:
          type: integer
          minimum: 1
        xpPerLevel:
          type: integer
          minimum: 1
        dailyGoalLessons:
          type: integer
          minimum: 1
    Completion:
      type: object
      required: [lessonId, completedAt]
      properties:
        lessonId:
          type: integer
        completedAt:
          type: string
          format: date-time
    AttemptRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          description: Type-specific answers (chosen options, known cards or checked findings).
          additionalProperties: true
    Attempt:
      type: object
      required: [id, exerciseId, createdAt]
      properties:
        id:
          type: integer
        exerciseId:
          type: integer
        createdAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
    Progress:
      type: object
      required: [courses, completedLessonIds]
      properties:
        courses:
          type: array
          description: The position of the learner in every course they started.
          items:
            $ref: "#/components/schemas/CourseProgress"
        completedLessonIds:
          type: array
          items:
            type: integer
    CourseProgress:
      type: object
      required: [courseId, nextLessonId, completedLessons, totalLessons]
      properties:
        courseId:
          type: integer
        nextLessonId:
          type: integer
          nullable: true
          description: The next lesson to do, or null when the course is finished.
        completedLessons:
          type: integer
          minimum: 0
        totalLessons:
          type: integer
          minimum: 0
    CheckResult:
      $ref: "schemas/check-result.schema.json"
